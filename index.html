<style>
  :root {
    --ink: #3b2a57; --sub: #7d6a9c; --accent: #8b5cf6; --accent2: #ec4899;
    --ok: #10b981; --ng: #f43f5e; --line: #e4d7fb; --card: rgba(255,255,255,.82);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { min-height: 100%; background: linear-gradient(160deg, #efe4ff 0%, #e2d1ff 38%, #f6dcf2 72%, #fdeef6 100%); background-color: #fdeef6; }
  body {
    margin: 0; color: var(--ink); min-height: 100vh;
    font-family: -apple-system, "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding: calc(8px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
    background:
      radial-gradient(circle at 12% 18%, rgba(255,255,255,.7) 0 2px, transparent 3px),
      radial-gradient(circle at 82% 8%, rgba(255,255,255,.8) 0 2px, transparent 3px),
      radial-gradient(circle at 70% 42%, rgba(255,255,255,.6) 0 1.5px, transparent 2.5px),
      radial-gradient(circle at 24% 70%, rgba(255,255,255,.6) 0 1.5px, transparent 2.5px),
      radial-gradient(circle at 90% 84%, rgba(255,255,255,.7) 0 2px, transparent 3px);
  }
  main { max-width: 520px; margin: 0 auto; }
  h1 {
    font-size: 26px; margin: 14px 0 2px; letter-spacing: .02em;
    background: linear-gradient(90deg, #7c3aed, #c026d3, #ec4899);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .lead { color: var(--sub); font-size: 15px; margin: 0 0 8px; }
  h2 { font-size: 16px; margin: 22px 0 10px; color: var(--sub); }
  .card {
    background: var(--card); border: 1.5px solid #fff; border-radius: 22px; padding: 18px;
    box-shadow: 0 6px 20px rgba(139,92,246,.15); backdrop-filter: blur(6px);
  }

  /* 案内役 */
  .guide { display: flex; align-items: flex-end; gap: 6px; margin: 6px 0 4px; }
  .guide svg { flex: none; filter: drop-shadow(0 4px 8px rgba(139,92,246,.25)); }
  .guide.big svg { width: 120px; height: 140px; }
  .guide.small svg { width: 76px; height: 88px; }
  .bubble {
    position: relative; flex: 1; background: #fff; border-radius: 18px; padding: 12px 14px;
    font-size: 16px; font-weight: 700; line-height: 1.5; color: var(--ink);
    box-shadow: 0 4px 14px rgba(139,92,246,.18); margin-bottom: 18px;
  }
  .bubble::before {
    content: ""; position: absolute; left: -9px; bottom: 16px;
    border: 9px solid transparent; border-right-color: #fff; border-left: 0;
  }
  .bubble .name { display: block; font-size: 12px; color: var(--accent2); margin-bottom: 2px; }
  .guide.pop svg { animation: pop .45s ease; }
  @keyframes pop { 0%{transform:translateY(0)} 35%{transform:translateY(-10px)} 70%{transform:translateY(2px)} 100%{transform:translateY(0)} }
  .noguide .guide { display: none !important; }

  /* 選択（時代・問題数）*/
  .eras { display: flex; flex-wrap: wrap; gap: 10px; }
  .eras label {
    border: 2px solid #fff; border-radius: 999px; padding: 12px 18px; min-height: 52px;
    display: inline-flex; align-items: center; font-size: 17px; font-weight: 700;
    background: rgba(255,255,255,.7); color: var(--sub); user-select: none;
  }
  .eras small { font-weight: 400; font-size: 12px; opacity: .8; margin-left: 2px; }
  .eras input, .row input { display: none; }
  .eras label:has(input:checked) {
    background: linear-gradient(135deg, #a78bfa, #e879f9); color: #fff; border-color: #fff;
    box-shadow: 0 4px 12px rgba(167,139,250,.45);
  }
  .row { display: flex; gap: 10px; }
  .row label {
    flex: 1; min-height: 58px; display: flex; align-items: center; justify-content: center;
    border: 2px solid #fff; border-radius: 16px; background: rgba(255,255,255,.7);
    font-size: 18px; font-weight: 700; color: var(--sub);
  }
  .row label:has(input:checked) { border-color: var(--accent); color: var(--accent); background: #fff; }
  .toggle { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; font-size: 16px; font-weight: 700; color: var(--sub); min-height: 52px; }
  .toggle input { width: 54px; height: 32px; appearance: none; -webkit-appearance: none; background: #d8cbef; border-radius: 999px; position: relative; transition: background .2s; }
  .toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: left .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .toggle input:checked { background: linear-gradient(135deg, #a78bfa, #e879f9); }
  .toggle input:checked::after { left: 25px; }

  /* ボタン */
  button {
    font: inherit; border: 0; border-radius: 20px; width: 100%; min-height: 64px; padding: 16px;
    font-size: 20px; font-weight: 800; cursor: pointer; letter-spacing: .03em;
    transition: transform .08s;
  }
  button:active { transform: scale(.97); }
  .primary {
    background: linear-gradient(135deg, #8b5cf6, #d946ef 60%, #ec4899); color: #fff; margin-top: 18px;
    box-shadow: 0 6px 16px rgba(217,70,239,.35);
  }
  .ghost { background: rgba(255,255,255,.75); color: var(--accent); border: 2px solid #fff; margin-top: 12px; }
  button:disabled { opacity: .45; }

  /* 出題 */
  .progress { display: flex; justify-content: space-between; color: var(--sub); font-size: 15px; font-weight: 700; margin: 12px 0 8px; }
  .bar { height: 10px; background: rgba(255,255,255,.7); border-radius: 5px; overflow: hidden; margin-bottom: 10px; }
  .bar div { height: 100%; background: linear-gradient(90deg, #a78bfa, #f472b6); width: 0; transition: width .25s; border-radius: 5px; }
  .kind { font-size: 13px; color: var(--accent2); font-weight: 700; margin-bottom: 6px; }
  .question { font-size: 23px; font-weight: 800; line-height: 1.5; }
  .choices { display: grid; gap: 12px; margin-top: 16px; }
  .choice {
    background: rgba(255,255,255,.92); border: 2.5px solid #fff; color: var(--ink); text-align: left;
    font-weight: 700; font-size: 19px; line-height: 1.4; min-height: 72px; padding: 14px 18px;
    box-shadow: 0 3px 10px rgba(139,92,246,.12);
  }
  .choice.ok { border-color: var(--ok); background: #e3f9f0; }
  .choice.ng { border-color: var(--ng); background: #ffe8ee; }
  .feedback { margin-top: 14px; font-size: 16px; line-height: 1.6; }
  .feedback:empty { display: none; }
  .feedback b.ok { color: var(--ok); } .feedback b.ng { color: var(--ng); }

  /* 結果 */
  .score { font-size: 52px; font-weight: 900; text-align: center; margin: 4px 0;
    background: linear-gradient(90deg, #8b5cf6, #ec4899); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .center { text-align: center; color: var(--sub); font-weight: 700; }
  ul.miss { padding-left: 20px; margin: 0; line-height: 1.8; font-size: 16px; }
  .note { font-size: 13px; color: var(--sub); margin-top: 14px; line-height: 1.6; }
  [hidden] { display: none !important; }
</style>
</head>

<main>
  <!-- スタート画面 -->
  <section id="home">
    <h1>歴史 年号クイズ</h1>
    <p class="lead">年号とできごと・人物を4択でおぼえよう</p>
    <div class="guide big" id="guideHome"><div class="bubble"><span class="name">ナビ・しおり</span><span class="line"></span></div></div>

    <h2>時代をえらぶ</h2>
    <div class="eras" id="eras"></div>

    <h2>問題の数</h2>
    <div class="row" id="counts">
      <label><input type="radio" name="count" value="10" checked>10問</label>
      <label><input type="radio" name="count" value="20">20問</label>
      <label><input type="radio" name="count" value="0">ぜんぶ</label>
    </div>

    <button class="primary" id="start">スタート</button>
    <button class="ghost" id="review">まちがえた問題だけ（<span id="missCount">0</span>問）</button>
    <label class="toggle">案内役のしおりを表示する<input type="checkbox" id="showGuide" checked></label>
    <p class="note">まちがえた問題はこの端末に記録され、正解すると消えます。</p>
  </section>

  <!-- 出題画面 -->
  <section id="quiz" hidden>
    <div class="progress"><span id="pos"></span><span id="right"></span></div>
    <div class="bar"><div id="barFill"></div></div>
    <div class="card">
      <div class="kind" id="kind"></div>
      <div class="question" id="question"></div>
    </div>
    <div class="choices" id="choices"></div>
    <div class="guide small" id="guideQuiz"><div class="bubble"><span class="name">しおり</span><span class="line"></span></div></div>
    <div class="feedback" id="feedback"></div>
    <button class="primary" id="next" hidden>つぎへ</button>
    <button class="ghost" id="quit">やめる</button>
  </section>

  <!-- 結果画面 -->
  <section id="result" hidden>
    <h1>けっか</h1>
    <div class="card">
      <div class="score" id="score"></div>
      <div class="center" id="scoreMsg"></div>
    </div>
    <div class="guide big" id="guideResult"><div class="bubble"><span class="name">しおり</span><span class="line"></span></div></div>
    <h2 id="missTitle">まちがえた問題</h2>
    <div class="card" id="missBox"><ul class="miss" id="missList"></ul></div>
    <button class="primary" id="again">もう一度</button>
    <button class="ghost" id="home2">はじめにもどる</button>
  </section>
</main>

  { era: "現代", year: 1945, event: "ポツダム宣言を受け入れ、戦争が終わる" },
  { era: "現代", year: 1946, event: "日本国憲法が公布される" },
  { era: "現代", year: 1951, event: "サンフランシスコ平和条約を結ぶ", person: "吉田茂" },
  { era: "現代", year: 1956, event: "日本が国際連合に加盟する" },
  { era: "現代", year: 1964, event: "東京オリンピックが開かれる" },
  { era: "現代", year: 1972, event: "沖縄が日本に返還される" },
];
const ERAS = ["古代", "中世", "近世", "近代", "現代"];
const ERA_NOTE = { 古代: "〜平安", 中世: "鎌倉〜安土桃山", 近世: "江戸", 近代: "明治〜昭和戦前", 現代: "戦後" };

// ---- 保存（まちがえた問題）----
const STORE_KEY = "history-quiz-miss-v1";
function loadMiss() {
  try { return new Set(JSON.parse(localStorage.getItem(STORE_KEY) || "[]")); } catch { return new Set(); }
}
function saveMiss(set) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify([...set])); } catch {}
}
let miss = loadMiss();

// ---- 問題の作り方 ----
// 1つのできごとから最大3種類の問題を作る
//  y2e: 年号 → できごと / e2y: できごと → 年号 / e2p: できごと → 人物
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const idOf = (item, type) => `${item.year}|${item.event}|${type}`;

function allQuestions(eras) {
  const qs = [];
  for (const it of ITEMS) {
    if (!eras.includes(it.era)) continue;
    qs.push({ item: it, type: "y2e" }, { item: it, type: "e2y" });
    if (it.person) qs.push({ item: it, type: "e2p" });
  }
  return qs;
}

function pickDistractors(pool, correct, n) {
  const uniq = [...new Set(pool)].filter(v => v !== correct);
  return shuffle(uniq).slice(0, n);
}

function build(q) {
  const it = q.item;
  if (q.type === "y2e") {
    // 同じ時代のできごとから選ぶ（同じ年のできごとはまぎらわしいので除く）
    let pool = ITEMS.filter(x => x.year !== it.year && x.era === it.era).map(x => x.event);
    if (pool.length < 3) pool = ITEMS.filter(x => x.year !== it.year).map(x => x.event);
    return { kind: "年号 → できごと", text: `${it.year}年のできごとは？`, answer: it.event,
             choices: shuffle([it.event, ...pickDistractors(pool, it.event, 3)]) };
  }
  if (q.type === "e2y") {
    // 近い年号ほど選ばれやすくして、ひっかけにする
    const near = ITEMS.map(x => x.year).filter(y => y !== it.year)
      .sort((a, b) => Math.abs(a - it.year) - Math.abs(b - it.year)).slice(0, 6);
    const ds = pickDistractors(near, it.year, 3);
    return { kind: "できごと → 年号", text: `「${it.event}」のは何年？`, answer: `${it.year}年`,
             choices: shuffle([it.year, ...ds]).map(y => `${y}年`) };
  }
  // e2p
  const pool = ITEMS.filter(x => x.person && x.person !== it.person)
    .sort((a, b) => Math.abs(a.year - it.year) - Math.abs(b.year - it.year))
    .slice(0, 10).map(x => x.person);
  return { kind: "できごと → 人物", text: `「${it.event}」に関係の深い人物は？`, answer: it.person,
           choices: shuffle([it.person, ...pickDistractors(pool, it.person, 3)]) };
}

// ---- 案内役「しおり」----
// セリフは種類ごとに山札にして順番に出す → ぜんぶ出し切るまで同じセリフは出ない
// {n} は連続回数に置きかわる。セリフを増やすときは配列に足すだけでOK。
const LINES = {

    "暇なの？ …いいわ、私も暇だったし",
    "今日こそ泣かせてあげるわ。ふふふ",

    "勘で押したら、すぐバレるわよ",
    "ゆっくりでいいわ。…5秒だけね",
    "さて、どれが本物かしら？",
  ],
  ok: [
    "ちっ…正解よ",
    "ふーん、やるじゃない。まぐれ？",
    "べ、別にほめてないんだからね",
    "正解。…つまらないわね",
    "私の次くらいにはすごいわ",
    "なかなかやるわね。認めてあげてもいいわ",
    "正解！…って、なんで私が喜んでるのよ",
    "ふふん、私が教えた甲斐があったわね",
    "当たり。調子に乗らないことね",
    "ぐぬぬ…完璧じゃない",

    "正解よ。ごほうびに…何もあげないけど",

  ],
  ng: [
    "はい残念〜♪",
    "ふふっ、ひっかかったわね",
    "あらあら、歴史の先生が泣いてるわよ",
    "その答え、何時代から来たの？",
    "まちがえた問題はリストに入れたわ。逃がさないわよ",
    "惜しい…って言ってほしい？ 言わないけど",
    "ドンマイ。…なんて私が言うと思った？",
    "今のは聞かなかったことにしてあげる。今回だけよ",
    "次まちがえたら、おしおきよ♪",
    "ほら、正解をよーく見て。覚えるまで出すからね",
    "ふーん、そう来たか。ハズレよ",
    "その間違い方、ある意味天才ね",
    "歴史が書きかわっちゃったわね。ハズレ",
    "残念。でも、ここで覚えれば勝ちよ",
  ],
  streakOk: [
    "{n}連続正解…？ ちょっと、やりすぎじゃない？",
    "{n}連続！ …私のライバルとして認めてあげる",
    "{n}連続ですって？ 生意気ね…",
    "{n}連続…ズルしてないでしょうね？",
  ],
  streakNg: [
    "{n}連続ハズレ…私の出番みたいね",
    "落ち着きなさい。深呼吸よ。…私は笑ってるけど",
    "ちょっと〜、寝てるの？",
    "{n}連続でハズレなんて、逆にむずかしいわよ？",
  ],
  perfect: [
    "パーフェクト…ですって？ くやしいけど今日はあなたの勝ちよ",
    "全問正解…ふん、次はもっとむずかしくしてやるんだから",
    "満点…！ べ、別にくやしくなんかないんだからね",
  ],
  good: [
    "なかなかね。でも満点じゃないのが惜しいわね〜",
    "ふふ、あと少しで私に並べたのに",
    "やるじゃない。…次は満点、取れるわよね？",
  ],
  soso: [
    "半分以上は正解。まぁまぁね。まちがえた所、逃がさないわよ",
    "悪くないわ。でも私を満足させるにはまだまだね",
    "ふーん、ふつうね。ふつうって一番つまらないのよ？",
  ],
  bad: [
    "あらあら…これは特訓が必要ね。付き合ってあげてもいいわよ",
    "今日のところは見逃してあげる。次はちゃんと覚えてきなさい",
    "ふふ、伸びしろしかないわね。…ほめてないわよ？",
  ],
};
const bags = {};
let lastLine = "";
function line(cat, n) {
  if (!bags[cat] || !bags[cat].length) {
    bags[cat] = shuffle(LINES[cat]);
    // 山札を作り直したときに、直前と同じセリフが続かないようにする
    if (bags[cat].length > 1 && bags[cat][bags[cat].length - 1] === lastLine) bags[cat].unshift(bags[cat].pop());
  }
  lastLine = bags[cat].pop();
  return lastLine.replace("{n}", n);
}
const GUIDE_KEY = "history-quiz-guide-v1";
document.querySelectorAll(".guide").forEach(g => g.prepend(document.getElementById("charTpl").content.cloneNode(true)));
function say(id, face, text) {
  const g = document.getElementById(id);
  g.dataset.face = face;
  g.querySelector(".line").textContent = text;
  g.classList.remove("pop"); void g.offsetWidth; if (face === "happy") g.classList.add("pop");
}
function applyGuide(on) {
  document.body.classList.toggle("noguide", !on);
  try { localStorage.setItem(GUIDE_KEY, on ? "1" : "0"); } catch {}
}
try { document.getElementById("showGuide").checked = localStorage.getItem(GUIDE_KEY) !== "0"; } catch {}

// ---- 画面 ----
const $ = id => document.getElementById(id);
const show = id => ["home", "quiz", "result"].forEach(s => $(s).hidden = s !== id);

$("eras").innerHTML = ERAS.map(e =>
  `<label><input type="checkbox" value="${e}" checked>${e}<small style="opacity:.7">（${ERA_NOTE[e]}）</small></label>`).join("");

function selectedEras() { return [...document.querySelectorAll("#eras input:checked")].map(i => i.value); }
function refreshHome() {
  $("missCount").textContent = miss.size;
  $("review").disabled = miss.size === 0;
  $("start").disabled = selectedEras().length === 0;
  say("guideHome", "normal", line(miss.size >= 5 && Math.random() < 0.4 ? "review" : "home"));
}
$("eras").addEventListener("change", refreshHome);
applyGuide($("showGuide").checked);
$("showGuide").addEventListener("change", e => applyGuide(e.target.checked));

let round = null; // { list, i, right, wrong:[], answered, mode }

function startRound(list, mode) {
  if (!list.length) { show("home"); refreshHome(); return; }
  round = { list, i: 0, right: 0, wrong: [], answered: false, mode, streak: 0 };
  show("quiz");
  render();
}

$("start").onclick = () => {
  const n = Number(document.querySelector("#counts input:checked").value);
  let list = shuffle(allQuestions(selectedEras()));
  if (n) list = list.slice(0, n);
  startRound(list, "normal");
};
$("review").onclick = () => {
  const all = allQuestions(ERAS);
  startRound(shuffle(all.filter(q => miss.has(idOf(q.item, q.type)))), "review");
};

function render() {
  const q = round.list[round.i];
  const b = build(q);
  round.current = { q, b };
  round.answered = false;
  $("pos").textContent = `${round.i + 1} / ${round.list.length}問`;
  $("right").textContent = `正解 ${round.right}`;
  $("barFill").style.width = `${round.i / round.list.length * 100}%`;
  $("kind").textContent = `${q.item.era}・${b.kind}`;
  $("question").textContent = b.text;
  $("feedback").innerHTML = "";
  say("guideQuiz", "normal", line("ask"));
  $("next").hidden = true;
  $("choices").innerHTML = "";
  for (const c of b.choices) {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.textContent = c;
    btn.onclick = () => answer(btn, String(c));
    $("choices").appendChild(btn);
  }
}

function answer(btn, value) {
  if (round.answered) return;
  round.answered = true;
  const { q, b } = round.current;
  const id = idOf(q.item, q.type);
  const ok = value === String(b.answer);
  for (const el of $("choices").children) {
    if (el.textContent === String(b.answer)) el.classList.add("ok");
  }
  const it = q.item;
  const fact = `${it.year}年 ${it.event}${it.person ? `（${it.person}）` : ""}`;
  if (ok) {
    round.right++;
    miss.delete(id);
    $("feedback").innerHTML = `<b class="ok">⭕ 正解！</b><br>${fact}`;
    round.streak = round.streak > 0 ? round.streak + 1 : 1;
    say("guideQuiz", "happy", round.streak >= 3 && round.streak % 2 === 1 ? line("streakOk", round.streak) : line("ok"));
  } else {
    btn.classList.add("ng");
    round.wrong.push(fact);
    miss.add(id);
    $("feedback").innerHTML = `<b class="ng">❌ ざんねん</b><br>${fact}`;
    round.streak = round.streak < 0 ? round.streak - 1 : -1;
    say("guideQuiz", "oops", round.streak <= -2 && round.streak % 2 === 0 ? line("streakNg", -round.streak) : line("ng"));
  }
  saveMiss(miss);
  $("right").textContent = `正解 ${round.right}`;
  $("next").hidden = false;
  $("next").textContent = round.i + 1 < round.list.length ? "つぎへ" : "けっかを見る";
}

$("next").onclick = () => {
  round.i++;
  if (round.i < round.list.length) render(); else finish();
};
$("quit").onclick = () => { if (round.i > 0 || round.answered) finish(true); else { show("home"); refreshHome(); } };

function finish(quit) {
  const total = quit ? round.i + (round.answered ? 1 : 0) : round.list.length;
  const pct = total ? Math.round(round.right / total * 100) : 0;
  $("score").textContent = `${round.right} / ${total}`;
  $("scoreMsg").textContent = `正答率 ${pct}%`;
  const msg = line(pct === 100 ? "perfect" : pct >= 80 ? "good" : pct >= 50 ? "soso" : "bad");
  say("guideResult", pct >= 50 ? "happy" : "oops", msg);
  const uniq = [...new Set(round.wrong)];
  $("missTitle").hidden = $("missBox").hidden = uniq.length === 0;
  $("missList").innerHTML = uniq.map(f => `<li>${f}</li>`).join("");
  show("result");
}
$("again").onclick = () => {
  if (round.mode === "review") $("review").onclick(); else $("start").onclick();
};
$("home2").onclick = () => { show("home"); refreshHome(); };

refreshHome();

if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
