<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#e9dcff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="歴史クイズ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/dot.woff2" as="font" type="font/woff2" crossorigin>
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>歴史 年号クイズ</title>
<style>
  @font-face { font-family: "Dot"; src: url("fonts/dot.woff2") format("woff2"); font-display: swap; }
  :root {
    --ink: #2a1f3d; --sub: #6b5a8e; --line: #2a1f3d;
    --ok: #16a34a; --ng: #e11d48; --px: 4px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html {
    min-height: 100%; background-color: #fbe3f1;
    /* 段々になったグラデーション（ドット絵風） */
    background-image: linear-gradient(180deg,
      #e9dcff 0 14%, #e3d2ff 14% 28%, #e6d0fb 28% 42%, #ecd2f6 42% 56%,
      #f1d5f2 56% 70%, #f6daf0 70% 84%, #fbe3f1 84% 100%);
  }
  body {
    margin: 0; color: var(--ink); min-height: 100vh;
    font-family: "Dot", "Hiragino Sans", "Noto Sans JP", monospace;
    padding: calc(8px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: none; font-smooth: never;
    position: relative;
  }
  /* ドットの星 */
  body::before {
    content: ""; position: fixed; top: 0; left: 0; width: 4px; height: 4px; background: transparent; pointer-events: none;
    box-shadow:
      40px 90px #fff, 320px 60px #fff, 250px 200px #fff8, 30px 330px #fff, 360px 380px #fffa,
      140px 500px #fff8, 300px 620px #fff, 60px 700px #fffa, 210px 780px #fff, 350px 860px #fff8,
      100px 160px #fde68a, 280px 450px #fbcfe8, 20px 560px #fde68a, 340px 720px #fbcfe8;
  }
  main { max-width: 520px; margin: 0 auto; position: relative; }
  h1 { font-size: 32px; margin: 16px 4px 10px; font-weight: 400; color: #fff;
       text-shadow: 2px 0 #4c1d95, -2px 0 #4c1d95, 0 2px #4c1d95, 0 -2px #4c1d95, 2px 2px #4c1d95, -2px 2px #4c1d95, 2px -2px #4c1d95, -2px -2px #4c1d95, 4px 4px #ec4899; }
  .lead { color: var(--sub); font-size: 15px; margin: 0 0 8px; }
  h2 { font-size: 17px; font-weight: 400; margin: 22px 0 12px; color: var(--sub); }
  h2::before { content: "◆ "; color: #ec4899; }

  /* ドットの枠（角が欠けた四角）*/
  .pxbox {
    position: relative; background: #fff;
    box-shadow:
      0 calc(var(--px) * -1) 0 0 var(--line), 0 var(--px) 0 0 var(--line),
      calc(var(--px) * -1) 0 0 0 var(--line), var(--px) 0 0 0 var(--line),
      var(--px) calc(var(--px) * 2) 0 0 rgba(76,29,149,.25), calc(var(--px) * 2) var(--px) 0 0 rgba(76,29,149,.25);
  }
  .card { padding: 18px; margin: 4px; }

  /* ロゴ */
  .logo { text-align: center; margin: 18px 0 6px; text-shadow: none; color: inherit; font-size: inherit; }
  .logo .ribbon {
    display: inline-block; background: #f472b6; color: #fff; font-size: 13px; letter-spacing: .2em; padding: 6px 14px;
    box-shadow: 0 -3px 0 #4c1d95, 0 3px 0 #4c1d95, -3px 0 0 #4c1d95, 3px 0 0 #4c1d95, inset 0 -3px 0 #db2777, inset 0 3px 0 #f9a8d4;
    margin-bottom: 10px;
  }
  .logo .t1, .logo .t2 { display: block; line-height: 1.15; letter-spacing: .04em; }
  .logo .t1 { font-size: 64px; color: #fff;
    text-shadow: 4px 0 #4c1d95, -4px 0 #4c1d95, 0 4px #4c1d95, 0 -4px #4c1d95, 4px 4px #4c1d95, -4px 4px #4c1d95, 4px -4px #4c1d95, -4px -4px #4c1d95, 8px 8px #ec4899, 4px 8px #ec4899, 8px 4px #ec4899; }
  .logo .t2 { font-size: 40px; color: #fde047; margin-top: 4px;
    text-shadow: 3px 0 #4c1d95, -3px 0 #4c1d95, 0 3px #4c1d95, 0 -3px #4c1d95, 3px 3px #4c1d95, -3px 3px #4c1d95, 3px -3px #4c1d95, -3px -3px #4c1d95, 6px 6px #8b5cf6, 3px 6px #8b5cf6, 6px 3px #8b5cf6; }
  .logo .deco { position: absolute; image-rendering: pixelated; }
  .logo-wrap { position: relative; }

  /* 案内役 */
  .guide { display: flex; align-items: flex-end; gap: 14px; margin: 10px 4px 6px; }
  .guide svg { flex: none; }
  .guide.big svg { width: 128px; height: 144px; }
  .guide.small svg { width: 96px; height: 108px; }
  .bubble { flex: 1; padding: 12px 14px; font-size: 17px; line-height: 1.55; margin: 0 4px 22px 4px; }
  .bubble .name { display: block; font-size: 13px; color: #ec4899; margin-bottom: 2px; }
  .guide.pop svg { animation: pop .4s steps(4); }
  @keyframes pop { 0%{transform:translateY(0)} 40%{transform:translateY(-12px)} 100%{transform:translateY(0)} }
  .noguide .guide { display: none !important; }

  /* 選択（時代・問題数）*/
  .eras { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 4px; }
  .eras label {
    padding: 10px 12px; min-height: 60px; display: flex; flex-direction: column; justify-content: center; font-size: 19px; line-height: 1.3;
    background: #fff; color: var(--sub); user-select: none;
  }
  .eras small { font-size: 12px; opacity: .85; }
  .eras input, .row input { display: none; }
  .eras label:has(input:checked) { background: #a78bfa; color: #fff; }
  .eras label { position: relative; }
  .eras label:has(input:checked)::after { content: "♥"; position: absolute; right: 10px; top: 8px; color: #fde047; }
  .row { display: flex; gap: 16px; padding: 4px; }
  .row label { flex: 1; min-height: 60px; display: flex; align-items: center; justify-content: center; font-size: 19px; color: var(--sub); }
  .row label:has(input:checked) { background: #fde047; color: var(--ink); }
  .toggle { display: flex; align-items: center; justify-content: space-between; margin-top: 22px; font-size: 16px; color: var(--sub); min-height: 52px; }
  .toggle input {
    width: 60px; height: 32px; appearance: none; -webkit-appearance: none; margin: 0 6px; background: #d8cbef; position: relative;
    box-shadow: 0 -4px 0 var(--line), 0 4px 0 var(--line), -4px 0 0 var(--line), 4px 0 0 var(--line);
  }
  .toggle input::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; background: #fff; box-shadow: inset -4px -4px 0 #d8cbef; transition: left .15s steps(3); }
  .toggle input:checked { background: #ec4899; }
  .toggle input:checked::after { left: 32px; box-shadow: inset -4px -4px 0 #fbcfe8; }

  /* ボタン */
  button {
    font: inherit; border: 0; border-radius: 0; width: calc(100% - 8px); margin-left: 4px; margin-right: 4px;
    min-height: 66px; padding: 16px; font-size: 22px; cursor: pointer; letter-spacing: .05em; color: var(--ink);
    background: #fff;
  }
  button.pxbtn { box-shadow:
      0 -4px 0 0 var(--line), 0 4px 0 0 var(--line), -4px 0 0 0 var(--line), 4px 0 0 0 var(--line),
      inset 0 -6px 0 0 rgba(0,0,0,.14), inset 0 4px 0 0 rgba(255,255,255,.55),
      4px 8px 0 0 rgba(76,29,149,.3); }
  button.pxbtn:active { transform: translateY(4px); box-shadow:
      0 -4px 0 0 var(--line), 0 4px 0 0 var(--line), -4px 0 0 0 var(--line), 4px 0 0 0 var(--line),
      inset 0 6px 0 0 rgba(0,0,0,.12); }
  .primary { background: #ec4899; color: #fff; margin-top: 22px; text-shadow: 2px 2px 0 #9d174d; }
  .primary::before { content: "▷ "; }
  .ghost { background: #fff; color: #7c3aed; margin-top: 18px; }
  button:disabled { opacity: .45; }

  /* 出題 */
  .progress { display: flex; justify-content: space-between; color: var(--sub); font-size: 16px; margin: 12px 4px 10px; }
  .bar { height: 16px; margin: 0 4px 16px; background: #fff; padding: 4px; }
  .bar div { height: 100%; width: 0; transition: width .25s steps(5);
    background: repeating-linear-gradient(90deg, #ec4899 0 12px, transparent 12px 16px); }
  .kind { font-size: 13px; color: #ec4899; margin-bottom: 8px; }
  .question { font-size: 23px; line-height: 1.55; }
  .choices { display: grid; gap: 20px; margin-top: 22px; }
  .choice { text-align: left; font-size: 19px; line-height: 1.45; min-height: 74px; padding: 14px 18px; }
  .choice.ok { background: #bbf7d0; }
  .choice.ok::after { content: " ◎"; color: var(--ok); }
  .choice.ng { background: #fecdd3; }
  .choice.ng::after { content: " ×"; color: var(--ng); }
  .feedback { margin: 14px 4px 0; font-size: 16px; line-height: 1.6; }
  .feedback:empty { display: none; }
  .feedback b { font-weight: 400; } .feedback b.ok { color: var(--ok); } .feedback b.ng { color: var(--ng); }

  /* 結果 */
  .score { font-size: 56px; text-align: center; margin: 4px 0; color: #fde047;
    text-shadow: 3px 0 #4c1d95, -3px 0 #4c1d95, 0 3px #4c1d95, 0 -3px #4c1d95, 3px 3px #4c1d95, -3px 3px #4c1d95, 3px -3px #4c1d95, -3px -3px #4c1d95, 6px 6px #ec4899; }
  .center { text-align: center; color: var(--sub); }
  ul.miss { list-style: none; padding: 0; margin: 0; line-height: 1.8; font-size: 16px; }
  ul.miss li::before { content: "■ "; color: #f472b6; }
  .note { font-size: 13px; color: var(--sub); margin-top: 16px; line-height: 1.6; }
  [hidden] { display: none !important; }
</style>
</head>

const ERAS = ["古代", "中世", "近世", "近代", "現代"];
const ERA_NOTE = { 古代: "〜平安", 中世: "鎌倉〜安土桃山", 近世: "江戸", 近代: "明治〜昭和戦前", 現代: "戦後" };

// ---- 保存（まちがえた問題）----
const STORE_KEY = "history-quiz-miss-v1";
function loadMiss() {
  try { return new Set(JSON.parse(localStorage.getItem(STORE_KEY) || "[]")); } catch { return new Set(); }
}
function saveMiss(set) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify([...set])); } catch {}
}
let miss = loadMiss();

// ---- 問題の作り方 ----
// 1つのできごとから最大3種類の問題を作る
//  y2e: 年号 → できごと / e2y: できごと → 年号 / e2p: できごと → 人物
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const idOf = (item, type) => `${item.year}|${item.event}|${type}`;

function allQuestions(eras) {
  const qs = [];
  for (const it of ITEMS) {
    if (!eras.includes(it.era)) continue;
    qs.push({ item: it, type: "y2e" }, { item: it, type: "e2y" });
    if (it.person) qs.push({ item: it, type: "e2p" });
  }
  return qs;
}

function pickDistractors(pool, correct, n) {
  const uniq = [...new Set(pool)].filter(v => v !== correct);
  return shuffle(uniq).slice(0, n);
}

function build(q) {
  const it = q.item;
  if (q.type === "y2e") {
    // 同じ時代のできごとから選ぶ（同じ年のできごとはまぎらわしいので除く）
    let pool = ITEMS.filter(x => x.year !== it.year && x.era === it.era).map(x => x.event);
    if (pool.length < 3) pool = ITEMS.filter(x => x.year !== it.year).map(x => x.event);
    return { kind: "年号 → できごと", text: `${it.year}年のできごとは？`, answer: it.event,
             choices: shuffle([it.event, ...pickDistractors(pool, it.event, 3)]) };
  }
  if (q.type === "e2y") {
    // 近い年号ほど選ばれやすくして、ひっかけにする
    const near = ITEMS.map(x => x.year).filter(y => y !== it.year)
      .sort((a, b) => Math.abs(a - it.year) - Math.abs(b - it.year)).slice(0, 6);
    const ds = pickDistractors(near, it.year, 3);
    return { kind: "できごと → 年号", text: `「${it.event}」のは何年？`, answer: `${it.year}年`,
             choices: shuffle([it.year, ...ds]).map(y => `${y}年`) };
  }
  // e2p
  const pool = ITEMS.filter(x => x.person && x.person !== it.person)
    .sort((a, b) => Math.abs(a.year - it.year) - Math.abs(b.year - it.year))
    .slice(0, 10).map(x => x.person);
  return { kind: "できごと → 人物", text: `「${it.event}」に関係の深い人物は？`, answer: it.person,
           choices: shuffle([it.person, ...pickDistractors(pool, it.person, 3)]) };
}

// {n} は連続回数に置きかわる。セリフを増やすときは配列に足すだけでOK。

const bags = {};
let lastLine = "";
function line(cat, n) {
  if (!bags[cat] || !bags[cat].length) {
    bags[cat] = shuffle(LINES[cat]);
    // 山札を作り直したときに、直前と同じセリフが続かないようにする
    if (bags[cat].length > 1 && bags[cat][bags[cat].length - 1] === lastLine) bags[cat].unshift(bags[cat].pop());
  }
  lastLine = bags[cat].pop();
  return lastLine.replace("{n}", n);
}
const GUIDE_KEY = "history-quiz-guide-v1";
document.querySelectorAll(".guide").forEach(g => g.prepend(document.getElementById("charTpl").content.cloneNode(true)));
function say(id, face, text) {
  const g = document.getElementById(id);
  g.dataset.face = face;
  g.querySelector(".line").textContent = text;
  g.classList.remove("pop"); void g.offsetWidth; if (face === "happy") g.classList.add("pop");
}
function applyGuide(on) {
  document.body.classList.toggle("noguide", !on);
  try { localStorage.setItem(GUIDE_KEY, on ? "1" : "0"); } catch {}
}
try { document.getElementById("showGuide").checked = localStorage.getItem(GUIDE_KEY) !== "0"; } catch {}

// ---- 画面 ----
const $ = id => document.getElementById(id);
const show = id => ["home", "quiz", "result"].forEach(s => $(s).hidden = s !== id);

$("eras").innerHTML = ERAS.map(e =>
  `<label class="pxbox"><input type="checkbox" value="${e}" checked>${e}<small>${ERA_NOTE[e]}</small></label>`).join("");

function selectedEras() { return [...document.querySelectorAll("#eras input:checked")].map(i => i.value); }
function refreshHome() {
  $("missCount").textContent = miss.size;
  $("review").disabled = miss.size === 0;
  $("start").disabled = selectedEras().length === 0;
  say("guideHome", "normal", line(miss.size >= 5 && Math.random() < 0.4 ? "review" : "home"));
}
$("eras").addEventListener("change", refreshHome);
applyGuide($("showGuide").checked);
$("showGuide").addEventListener("change", e => applyGuide(e.target.checked));

let round = null; // { list, i, right, wrong:[], answered, mode }

function startRound(list, mode) {
  if (!list.length) { show("home"); refreshHome(); return; }
  round = { list, i: 0, right: 0, wrong: [], answered: false, mode, streak: 0 };
  show("quiz");
  render();
}

$("start").onclick = () => {
  const n = Number(document.querySelector("#counts input:checked").value);
  let list = shuffle(allQuestions(selectedEras()));
  if (n) list = list.slice(0, n);
  startRound(list, "normal");
};
$("review").onclick = () => {
  const all = allQuestions(ERAS);
  startRound(shuffle(all.filter(q => miss.has(idOf(q.item, q.type)))), "review");
};

function render() {
  const q = round.list[round.i];
  const b = build(q);
  round.current = { q, b };
  round.answered = false;
  $("pos").textContent = `${round.i + 1} / ${round.list.length}問`;
  $("right").textContent = `正解 ${round.right}`;
  $("barFill").style.width = `${round.i / round.list.length * 100}%`;
  $("kind").textContent = `${q.item.era}・${b.kind}`;
  $("question").textContent = b.text;
  $("feedback").innerHTML = "";
  say("guideQuiz", "normal", line("ask"));
  $("next").hidden = true;
  $("choices").innerHTML = "";
  for (const c of b.choices) {
    const btn = document.createElement("button");
    btn.className = "choice pxbtn";
    btn.textContent = c;
    btn.onclick = () => answer(btn, String(c));
    $("choices").appendChild(btn);
  }
}

function answer(btn, value) {
  if (round.answered) return;
  round.answered = true;
  const { q, b } = round.current;
  const id = idOf(q.item, q.type);
  const ok = value === String(b.answer);
  for (const el of $("choices").children) {
    if (el.textContent === String(b.answer)) el.classList.add("ok");
  }
  const it = q.item;
  const fact = `${it.year}年 ${it.event}${it.person ? `（${it.person}）` : ""}`;
  if (ok) {
    round.right++;
    miss.delete(id);
    $("feedback").innerHTML = `<b class="ok">◎ 正解！</b><br>${fact}`;
    round.streak = round.streak > 0 ? round.streak + 1 : 1;
    say("guideQuiz", "happy", round.streak >= 3 && round.streak % 2 === 1 ? line("streakOk", round.streak) : line("ok"));
  } else {
    btn.classList.add("ng");
    round.wrong.push(fact);
    miss.add(id);
    $("feedback").innerHTML = `<b class="ng">× ざんねん</b><br>${fact}`;
    round.streak = round.streak < 0 ? round.streak - 1 : -1;
    say("guideQuiz", "oops", round.streak <= -2 && round.streak % 2 === 0 ? line("streakNg", -round.streak) : line("ng"));
  }
  saveMiss(miss);
  $("right").textContent = `正解 ${round.right}`;
  $("next").hidden = false;
  $("next").textContent = round.i + 1 < round.list.length ? "つぎへ" : "けっかを見る";
}

$("next").onclick = () => {
  round.i++;
  if (round.i < round.list.length) render(); else finish();
};
$("quit").onclick = () => { if (round.i > 0 || round.answered) finish(true); else { show("home"); refreshHome(); } };

function finish(quit) {
  const total = quit ? round.i + (round.answered ? 1 : 0) : round.list.length;
  const pct = total ? Math.round(round.right / total * 100) : 0;
  $("score").textContent = `${round.right} / ${total}`;
  $("scoreMsg").textContent = `正答率 ${pct}%`;
  const msg = line(pct === 100 ? "perfect" : pct >= 80 ? "good" : pct >= 50 ? "soso" : "bad");
  say("guideResult", pct >= 50 ? "happy" : "oops", msg);
  const uniq = [...new Set(round.wrong)];
  $("missTitle").hidden = $("missBox").hidden = uniq.length === 0;
  $("missList").innerHTML = uniq.map(f => `<li>${f}</li>`).join("");
  show("result");
}
$("again").onclick = () => {
  if (round.mode === "review") $("review").onclick(); else $("start").onclick();
};
$("home2").onclick = () => { show("home"); refreshHome(); };
