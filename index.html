<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#e9dcff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="歴史クイズ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/dot.woff2" as="font" type="font/woff2" crossorigin>
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>歴史 年号クイズ</title>
<style>
  @font-face { font-family: "Dot"; src: url("fonts/dot.woff2") format("woff2"); font-display: swap; }
  :root { --ink: #2a1f3d; --sub: #6b5a8e; --line: #2a1f3d; --ok: #16a34a; --ng: #e11d48; --px: 4px; --win: #120d24; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html {
    min-height: 100%; background-color: #fbe3f1;
    background-image: linear-gradient(180deg,
      #e9dcff 0 14%, #e3d2ff 14% 28%, #e6d0fb 28% 42%, #ecd2f6 42% 56%,
      #f1d5f2 56% 70%, #f6daf0 70% 84%, #fbe3f1 84% 100%);
  }
  body {
    margin: 0; color: var(--ink); min-height: 100vh;
    font-family: "Dot", "Hiragino Sans", "Noto Sans JP", monospace;
    padding: calc(8px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: none; position: relative;
  }
  body::before {
    content: ""; position: fixed; top: 0; left: 0; width: 4px; height: 4px; pointer-events: none;
    box-shadow:
      40px 90px #fff, 320px 60px #fff, 250px 200px #fff8, 30px 330px #fff, 360px 380px #fffa,
      140px 500px #fff8, 300px 620px #fff, 60px 700px #fffa, 210px 780px #fff, 350px 860px #fff8,
      100px 160px #fde68a, 280px 450px #fbcfe8, 20px 560px #fde68a, 340px 720px #fbcfe8;
  }
  main { max-width: 520px; margin: 0 auto; position: relative; }
  h2 { font-size: 17px; font-weight: 400; margin: 22px 0 12px; color: var(--sub); }
  h2::before { content: "◆ "; color: #ec4899; }
  .lead { color: var(--sub); font-size: 15px; margin: 0 0 8px; }
  .center { text-align: center; }

  /* ドット枠（白）*/
  .pxbox {
    position: relative; background: #fff;
    box-shadow:
      0 calc(var(--px) * -1) 0 0 var(--line), 0 var(--px) 0 0 var(--line),
      calc(var(--px) * -1) 0 0 0 var(--line), var(--px) 0 0 0 var(--line),
      var(--px) calc(var(--px) * 2) 0 0 rgba(76,29,149,.25), calc(var(--px) * 2) var(--px) 0 0 rgba(76,29,149,.25);
  }
  /* RPGウィンドウ（黒地に白い枠）*/
  .win {
    position: relative; background: var(--win); color: #fff; border: 4px solid #fff; border-radius: 10px;
    box-shadow: 0 0 0 4px var(--win), 6px 10px 0 4px rgba(76,29,149,.3);
    padding: 14px 16px; margin: 8px 4px;
  }
  .win .label { position: absolute; top: -14px; left: 14px; background: var(--win); padding: 0 8px; font-size: 13px; color: #fde047; }

  /* ロゴ */
  .logo { text-align: center; margin: 18px 0 6px; font-weight: 400; }
  .logo .ribbon {
    display: inline-block; background: #f472b6; color: #fff; font-size: 13px; letter-spacing: .2em; padding: 6px 14px;
    box-shadow: 0 -3px 0 #4c1d95, 0 3px 0 #4c1d95, -3px 0 0 #4c1d95, 3px 0 0 #4c1d95, inset 0 -3px 0 #db2777, inset 0 3px 0 #f9a8d4;
    margin-bottom: 10px;
  }
  .logo .t1, .logo .t2 { display: block; line-height: 1.15; letter-spacing: .04em; }
  .logo .t1 { font-size: 64px; color: #fff;
    text-shadow: 4px 0 #4c1d95, -4px 0 #4c1d95, 0 4px #4c1d95, 0 -4px #4c1d95, 4px 4px #4c1d95, -4px 4px #4c1d95, 4px -4px #4c1d95, -4px -4px #4c1d95, 8px 8px #ec4899, 4px 8px #ec4899, 8px 4px #ec4899; }
  .logo .t2 { font-size: 40px; color: #fde047; margin-top: 4px;
    text-shadow: 3px 0 #4c1d95, -3px 0 #4c1d95, 0 3px #4c1d95, 0 -3px #4c1d95, 3px 3px #4c1d95, -3px 3px #4c1d95, 3px -3px #4c1d95, -3px -3px #4c1d95, 6px 6px #8b5cf6, 3px 6px #8b5cf6, 6px 3px #8b5cf6; }
  .logo .deco { position: absolute; image-rendering: pixelated; }
  .logo-wrap { position: relative; }

  /* ステータス */
  .status { font-size: 16px; line-height: 1.7; }
  .status .row1 { display: flex; justify-content: space-between; gap: 8px; }
  .status .title { color: #fde047; font-size: 14px; }
  .expbar { height: 12px; background: #3b3160; margin-top: 6px; }
  .expbar div { height: 100%; width: 0; background: repeating-linear-gradient(90deg, #fde047 0 8px, #f59e0b 8px 12px); }
  .status small { font-size: 12px; color: #c4b5fd; }

  /* 案内役 */
  .guide { display: flex; align-items: flex-end; gap: 14px; margin: 10px 4px 6px; }
  .guide .sprite { flex: none; }
  .guide.big .sprite svg { width: 128px; height: 144px; display: block; }
  .guide.small .sprite svg { width: 80px; height: 90px; display: block; }
  .bubble { flex: 1; padding: 12px 14px; font-size: 16px; line-height: 1.55; margin: 0 4px 20px 4px; min-height: 64px; }
  .bubble .name { display: block; font-size: 13px; color: #f9a8d4; margin-bottom: 2px; }
  .guide .sprite svg .f-happy, .guide .sprite svg .f-oops { display: none; }
  .guide[data-face="happy"] svg .f-normal, .guide[data-face="oops"] svg .f-normal { display: none; }
  .guide[data-face="happy"] svg .f-happy { display: inline; }
  .guide[data-face="oops"] svg .f-oops { display: inline; }
  .guide.pop .sprite { animation: pop .4s steps(4); }
  @keyframes pop { 0%{transform:translateY(0)} 40%{transform:translateY(-12px)} 100%{transform:translateY(0)} }
  .noguide .guide { display: none !important; }

  /* 選択（時代・問題数）*/
  .eras { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 4px; }
  .eras label { position: relative; padding: 10px 12px; min-height: 60px; display: flex; flex-direction: column; justify-content: center; font-size: 19px; line-height: 1.3; color: var(--sub); user-select: none; }
  .eras small { font-size: 12px; opacity: .85; }
  .eras input, .row input { display: none; }
  .eras label:has(input:checked) { background: #a78bfa; color: #fff; }
  .eras label:has(input:checked)::after { content: "♥"; position: absolute; right: 10px; top: 8px; color: #fde047; }
  .row { display: flex; gap: 16px; padding: 4px; }
  .row label { flex: 1; min-height: 60px; display: flex; align-items: center; justify-content: center; font-size: 19px; color: var(--sub); }
  .row label:has(input:checked) { background: #fde047; color: var(--ink); }
  .toggle { display: flex; align-items: center; justify-content: space-between; margin-top: 22px; font-size: 16px; color: var(--sub); min-height: 52px; }
  .toggle input {
    width: 60px; height: 32px; appearance: none; -webkit-appearance: none; margin: 0 6px; background: #d8cbef; position: relative;
    box-shadow: 0 -4px 0 var(--line), 0 4px 0 var(--line), -4px 0 0 var(--line), 4px 0 0 var(--line);
  }
  .toggle input::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; background: #fff; box-shadow: inset -4px -4px 0 #d8cbef; transition: left .15s steps(3); }
  .toggle input:checked { background: #ec4899; }
  .toggle input:checked::after { left: 32px; box-shadow: inset -4px -4px 0 #fbcfe8; }

  /* ボタン */
  button {
    font: inherit; border: 0; border-radius: 0; width: calc(100% - 8px); margin-left: 4px; margin-right: 4px;
    min-height: 66px; padding: 16px; font-size: 22px; cursor: pointer; letter-spacing: .05em; color: var(--ink); background: #fff;
  }
  button.pxbtn { box-shadow:
      0 -4px 0 0 var(--line), 0 4px 0 0 var(--line), -4px 0 0 0 var(--line), 4px 0 0 0 var(--line),
      inset 0 -6px 0 0 rgba(0,0,0,.14), inset 0 4px 0 0 rgba(255,255,255,.55), 4px 8px 0 0 rgba(76,29,149,.3); }
  button.pxbtn:active { transform: translateY(4px); box-shadow:
      0 -4px 0 0 var(--line), 0 4px 0 0 var(--line), -4px 0 0 0 var(--line), 4px 0 0 0 var(--line), inset 0 6px 0 0 rgba(0,0,0,.12); }
  .primary { background: #ec4899; color: #fff; margin-top: 22px; text-shadow: 2px 2px 0 #9d174d; }
  .primary::before { content: "▷ "; }
  .ghost { background: #fff; color: #7c3aed; margin-top: 18px; }
  .twin { display: flex; gap: 16px; margin: 18px 4px 0; }
  .twin button { margin: 0; width: auto; flex: 1; font-size: 17px; padding: 12px 6px; letter-spacing: 0; }
  button:disabled { opacity: .45; }

  /* バトル */
  .hud { display: flex; justify-content: space-between; align-items: center; font-size: 16px; }
  .hearts { color: #f472b6; letter-spacing: 2px; font-size: 18px; }
  .field { position: relative; text-align: center; padding: 10px 0 4px; min-height: 170px; }
  .field .mon svg { width: 112px; height: 112px; display: block; margin: 0 auto; }
  .field .mon { display: inline-block; position: relative; }
  .field .mon::after { content: ""; display: block; width: 80px; height: 8px; margin: 2px auto 0; background: rgba(76,29,149,.25); }
  .mname { font-size: 16px; margin-top: 4px; }
  .mhp { width: 160px; height: 12px; margin: 6px auto 0; background: #fff; box-shadow: 0 -3px 0 var(--line), 0 3px 0 var(--line), -3px 0 0 var(--line), 3px 0 0 var(--line); }
  .mhp div { height: 100%; background: #22c55e; transition: width .3s steps(6); }
  .mhp div.low { background: #ef4444; }
  .dmg { position: absolute; left: 50%; top: 30px; transform: translateX(-50%); font-size: 30px; color: #fff; pointer-events: none;
         text-shadow: 3px 0 var(--line), -3px 0 var(--line), 0 3px var(--line), 0 -3px var(--line); animation: dmg .9s steps(6) forwards; }
  .dmg.crit { color: #fde047; font-size: 38px; }
  @keyframes dmg { 0%{opacity:1; margin-top:0} 70%{opacity:1; margin-top:-28px} 100%{opacity:0; margin-top:-36px} }
  .hit svg { animation: blink .5s steps(1) 2; }
  @keyframes blink { 50% { opacity: 0; } }
  .dead svg { animation: vanish .8s steps(5) forwards; }
  @keyframes vanish { to { opacity: 0; transform: scaleY(.1) translateY(80px); } }
  .shake { animation: shake .35s steps(2) 2; }
  @keyframes shake { 0%{transform:translate(0,0)} 50%{transform:translate(-6px,2px)} 100%{transform:translate(6px,-2px)} }
  .flash::after { content: ""; position: fixed; inset: 0; background: #fff; pointer-events: none; animation: flash .3s steps(2) forwards; }
  @keyframes flash { to { opacity: 0; } }

  .msg { min-height: 112px; font-size: 19px; line-height: 1.6; white-space: pre-wrap; }
  .msg .kind { display: block; font-size: 13px; color: #f9a8d4; margin-bottom: 4px; }
  .msg .more { position: absolute; right: 12px; bottom: 6px; color: #fde047; animation: blink 1s steps(1) infinite; }
  .cmd { padding: 8px 6px; }
  .choice {
    display: flex; gap: 6px; align-items: flex-start; text-align: left; background: transparent; color: #fff; box-shadow: none;
    width: 100%; margin: 0; min-height: 60px; padding: 14px 8px; font-size: 19px; line-height: 1.45;
  }
  .choice + .choice { border-top: 2px dashed #3b3160; }
  .choice .cur { flex: none; width: 1.1em; color: #fde047; visibility: hidden; }
  .choice:active .cur, .choice.sel .cur { visibility: visible; animation: blink .6s steps(1) infinite; }
  .choice.ok { color: #86efac; }
  .choice.ok::after { content: "◎"; margin-left: auto; }
  .choice.ng { color: #fda4af; } .choice.ng::after { content: "×"; margin-left: auto; }
  .choice:disabled { opacity: 1; }
  .cmd.locked .choice:not(.ok):not(.ng) { opacity: .45; }
  .fact { font-size: 15px; color: #c4b5fd; line-height: 1.6; margin-top: 6px; }
  .fact:empty { display: none; }

  /* 結果・宝箱 */
  .big-msg { font-size: 22px; line-height: 1.6; text-align: center; }
  .score { font-size: 48px; text-align: center; margin: 8px 0 0; color: #fde047; }
  .gain { font-size: 16px; line-height: 1.8; }
  .chest { text-align: center; padding: 6px 0; }
  .chest button { background: transparent; box-shadow: none; width: auto; min-height: 0; padding: 4px; margin: 0 auto; display: inline-block; }
  .chest svg { width: 96px; height: 80px; display: block; }
  .chest .tap { font-size: 14px; color: #fde047; animation: blink 1s steps(1) infinite; }
  .card-get { text-align: center; font-size: 18px; line-height: 1.6; }
  .card-get b { font-weight: 400; color: #fde047; font-size: 24px; }
  ul.miss { list-style: none; padding: 0; margin: 0; line-height: 1.8; font-size: 16px; }
  ul.miss li::before { content: "■ "; color: #f472b6; }

  /* ずかん */
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 4px; }
  .pcard { padding: 12px; min-height: 96px; font-size: 13px; line-height: 1.6; }
  .pcard .pn { font-size: 18px; color: #7c3aed; display: block; margin-bottom: 4px; }
  .pcard.locked { background: #e9e3f5; color: #9a8fb3; }
  .pcard.locked .pn { color: #9a8fb3; }
  .rec { font-size: 17px; line-height: 2; }
  .rec dt { color: #c4b5fd; font-size: 13px; }
  .rec dd { margin: 0 0 6px; }
  input.name { font: inherit; font-size: 18px; width: 100%; padding: 10px; border: 0; background: #fff; color: var(--ink); border-radius: 0; }
  .note { font-size: 13px; color: var(--sub); margin-top: 16px; line-height: 1.6; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <!-- スタート画面 -->
  <section id="home">
    <h1 class="logo" aria-label="歴史 年号クイズ"><div class="logo-wrap">
      <span class="ribbon">★ HISTORY STAGE ★</span>
      <span class="t1">歴史</span>
      <span class="t2">年号クイズ</span>
      <svg class="deco" viewBox="0 0 7 7" width="28" height="28" style="left:6%;top:64px" shape-rendering="crispEdges"><path d="M3 0h1v2h2v1h1v1h-1v1h1v2h-1v-1h-1v-1h-1v1h-1v-1h-1v1h-1v1h-1v-2h1v-1h-1v-1h1v-1h2z" fill="#fde047"/></svg>
      <svg class="deco" viewBox="0 0 7 7" width="18" height="18" style="right:8%;top:150px" shape-rendering="crispEdges"><path d="M3 0h1v2h2v1h1v1h-1v1h1v2h-1v-1h-1v-1h-1v1h-1v-1h-1v1h-1v1h-1v-2h1v-1h-1v-1h1v-1h2z" fill="#fff"/></svg>
      <svg class="deco" viewBox="0 0 7 7" width="14" height="14" style="left:14%;top:150px" shape-rendering="crispEdges"><path d="M3 0h1v2h2v1h1v1h-1v1h1v2h-1v-1h-1v-1h-1v1h-1v-1h-1v1h-1v1h-1v-2h1v-1h-1v-1h1v-1h2z" fill="#f9a8d4"/></svg>
      <svg class="deco" viewBox="0 0 6 8" width="21" height="28" style="right:12%;top:60px" shape-rendering="crispEdges"><path d="M2 0h4v5h-1v-3h-2v4h-1v2h-2v-2h1v-1h1z" fill="#ec4899"/><path d="M5 5h-1v2h-1v1h2z" fill="#ec4899"/></svg>
    </div></h1>
    <p class="lead center">年号とできごと・人物を4択でおぼえよう</p>

    <div class="win status" id="status"></div>

    <div class="guide big" id="guideHome"><div class="sprite"></div><div class="bubble win"><span class="name">まおうぐん かんぶ しおり</span><span class="line"></span></div></div>

    <h2>ぼうけんする じだい</h2>
    <div class="eras" id="eras"></div>

    <h2>もんだいの かず</h2>
    <div class="row" id="counts">
      <label class="pxbox"><input type="radio" name="count" value="10" checked>10問</label>
      <label class="pxbox"><input type="radio" name="count" value="20">20問</label>
      <label class="pxbox"><input type="radio" name="count" value="0">ぜんぶ</label>
    </div>

    <button class="primary pxbtn" id="start">たたかう</button>
    <button class="ghost pxbtn" id="review">まちがえた問題と たたかう（<span id="missCount">0</span>問）</button>
    <div class="twin">
      <button class="pxbtn" id="openZukan">ずかん</button>
      <button class="pxbtn" id="openRecord">ぼうけんのしょ</button>
    </div>
    <label class="toggle">しおりを表示する<input type="checkbox" id="showGuide" checked></label>
    <p class="note">きろくは この端末の中だけに ほぞんされます。</p>
  </section>

  <!-- バトル -->
  <section id="quiz" hidden>
    <div class="win hud"><span id="heroName">ゆうしゃ</span><span class="hearts" id="hearts"></span><span id="pos"></span></div>
    <div class="field" id="field">
      <div class="mon" id="mon"></div>
      <div class="mname" id="mname"></div>
      <div class="mhp"><div id="mhp"></div></div>
    </div>
    <div class="win msg" id="msgWin"><span class="kind" id="kind"></span><span id="msg"></span><span class="more" id="more" hidden>▼</span></div>
    <div class="win cmd" id="choices"></div>
    <div class="guide small" id="guideQuiz"><div class="sprite"></div><div class="bubble win"><span class="name">しおり</span><span class="line"></span></div></div>
    <button class="primary pxbtn" id="next" hidden>つぎへ</button>
    <button class="ghost pxbtn" id="quit">にげる</button>
  </section>

  <!-- 結果 -->
  <section id="result" hidden>
    <div class="win big-msg" id="endMsg"></div>
    <div class="win">
      <span class="label">けっか</span>
      <div class="score" id="score"></div>
      <div class="center" id="scoreMsg" style="color:#c4b5fd"></div>
      <div class="gain" id="gain"></div>
    </div>
    <div class="win" id="chestBox" hidden>
      <span class="label">たからばこ</span>
      <div class="chest" id="chest"></div>
      <div class="card-get" id="cardGet"></div>
    </div>
    <div class="guide big" id="guideResult"><div class="sprite"></div><div class="bubble win"><span class="name">しおり</span><span class="line"></span></div></div>
    <h2 id="missTitle">まちがえた問題</h2>
    <div class="pxbox" id="missBox" style="padding:16px;margin:4px"><ul class="miss" id="missList"></ul></div>
    <button class="primary pxbtn" id="again">もう一度 たたかう</button>
    <button class="ghost pxbtn" id="home2">はじめに もどる</button>
  </section>

  <!-- ずかん -->
  <section id="zukan" hidden>
    <div class="win"><span class="label">じんぶつ ずかん</span><div id="zukanCount" style="font-size:18px"></div><small style="color:#c4b5fd">ボスを たおすと たからばこから カードが でるよ</small></div>
    <div class="cards" id="cards" style="margin-top:14px"></div>
    <button class="ghost pxbtn" id="zukanBack">もどる</button>
  </section>

  <!-- ぼうけんのしょ -->
  <section id="record" hidden>
    <div class="win"><span class="label">ぼうけんのしょ</span><dl class="rec" id="rec"></dl></div>
    <h2>ゆうしゃの なまえ</h2>
    <div class="pxbox" style="margin:4px"><input class="name" id="nameInput" maxlength="8" placeholder="ゆうしゃ"></div>
    <button class="ghost pxbtn" id="recordBack">もどる</button>
  </section>
</main>

const bags = {};
let lastLine = "";
function line(cat, vars = {}) {
  if (!bags[cat] || !bags[cat].length) {
    bags[cat] = shuffle(LINES[cat]);
    if (bags[cat].length > 1 && bags[cat][bags[cat].length - 1] === lastLine) bags[cat].unshift(bags[cat].pop());
  }
  lastLine = bags[cat].pop();
  return lastLine.replace("{n}", vars.n ?? "").replace("{m}", vars.m ?? "");
}

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const idOf = (item, type) => `${item.year}|${item.event}|${type}`;
function allQuestions(eras) {
  const qs = [];
  for (const it of ITEMS) {
    if (!eras.includes(it.era)) continue;
    qs.push({ item: it, type: "y2e" }, { item: it, type: "e2y" });
    if (it.person) qs.push({ item: it, type: "e2p" });
  }
  return qs;
}
const pickDistractors = (pool, correct, n) => shuffle([...new Set(pool)].filter(v => v !== correct)).slice(0, n);
function build(q) {
  const it = q.item;
  if (q.type === "y2e") {
    let pool = ITEMS.filter(x => x.year !== it.year && x.era === it.era).map(x => x.event);
    if (pool.length < 3) pool = ITEMS.filter(x => x.year !== it.year).map(x => x.event);
    return { kind: "年号 → できごと", text: `${it.year}年の できごとは？`, answer: it.event,
             choices: shuffle([it.event, ...pickDistractors(pool, it.event, 3)]) };
  }
  if (q.type === "e2y") {
    const near = ITEMS.map(x => x.year).filter(y => y !== it.year).sort((a, b) => Math.abs(a - it.year) - Math.abs(b - it.year)).slice(0, 6);
    return { kind: "できごと → 年号", text: `「${it.event}」のは 何年？`, answer: `${it.year}年`,
             choices: shuffle([it.year, ...pickDistractors(near, it.year, 3)]).map(y => `${y}年`) };
  }
  const pool = ITEMS.filter(x => x.person && x.person !== it.person)
    .sort((a, b) => Math.abs(a.year - it.year) - Math.abs(b.year - it.year)).slice(0, 10).map(x => x.person);
  return { kind: "できごと → 人物", text: `「${it.event}」に 関係の深い 人物は？`, answer: it.person,
           choices: shuffle([it.person, ...pickDistractors(pool, it.person, 3)]) };
}

function typeText(el, text, speed = 28) {
  if (typing) typing.finish();
  return new Promise(res => {
    let i = 0, timer = null;
    const finish = () => { clearTimeout(timer); el.textContent = text; typing = null; res(); };
    const step = () => { el.textContent = text.slice(0, ++i); if (i < text.length) timer = setTimeout(step, speed); else finish(); };
    typing = { finish };
    step();
  });
}

function updateBars() {
  const pct = Math.max(0, B.hp / B.maxHp * 100);
  $("mhp").style.width = pct + "%";
  $("mhp").classList.toggle("low", pct <= 30);
  $("hearts").textContent = "♥".repeat(Math.max(0, B.heroHp)) + "♡".repeat(Math.max(0, B.heroMax - B.heroHp));
  $("pos").textContent = `${Math.min(B.i + 1, B.list.length)}/${B.list.length}`;
}

function ask() {
  const q = B.list[B.i];
  const b = build(q);
  B.current = { q, b }; B.answered = false; B.busy = false; B.shownAt = Date.now();
  updateBars();
  $("kind").textContent = `${q.item.era}・${b.kind}`;
  $("next").hidden = true;
  say("guideQuiz", "normal", line("ask"));
  const box = $("choices"); box.innerHTML = ""; box.classList.remove("locked");
  for (const c of b.choices) {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = `<span class="cur">▷</span><span class="t"></span>`;
    btn.querySelector(".t").textContent = c;
    btn.dataset.v = String(c);
    btn.onclick = () => answer(btn);
    box.appendChild(btn);
  }
  typeText($("msg"), b.text, 22);
}

  const box = $("choices"); box.classList.add("locked");
  btn.classList.add("sel");
  for (const el of box.children) { el.disabled = true; if (el.dataset.v === String(b.answer)) el.classList.add("ok"); }
  const it = q.item;
  B.items.add(it);
  save.answered++;
  let text;
  if (ok) {
    B.right++; B.combo++; B.missCombo = 0; save.correct++; miss.delete(id);
    save.bestCombo = Math.max(save.bestCombo, B.combo);
    const fast = Date.now() - B.shownAt < 2000;
    const crit = fast || B.combo % 3 === 0;
    let dmg = 8 + Math.floor(Math.random() * 5);
    if (crit) dmg *= 2;
    B.hp -= dmg; B.exp += crit ? 15 : 10;
    $("mon").classList.remove("hit"); void $("mon").offsetWidth; $("mon").classList.add("hit");
    floatDmg(dmg, crit);
    text = `${heroName()}の こうげき！\n${crit ? "かいしんの いちげき！\n" : ""}${B.monName}に ${dmg}の ダメージ！`;
    say("guideQuiz", crit ? "oops" : "happy", line(crit ? "crit" : "ok"));
  } else {
    btn.classList.add("ng");
    B.combo = 0; B.missCombo++; miss.add(id); B.heroHp--;
    B.wrong.push(it);
    document.querySelector("main").classList.remove("shake"); void document.querySelector("main").offsetWidth;
    document.querySelector("main").classList.add("shake");
    text = `${B.monName}の こうげき！\n${heroName()}は 1の ダメージを うけた！`;
    say("guideQuiz", "happy", B.missCombo >= 2 && B.missCombo % 2 === 0 ? line("streakNg", { n: B.missCombo }) : line("ng"));
  }
  saveMiss(); persist(); updateBars();
  $("kind").textContent = `${ok ? "◎ せいかい" : "× ざんねん"}　${it.year}年 ${it.event}${it.person ? `（${it.person}）` : ""}`;
  await typeText($("msg"), text);
  B.busy = false;
  const over = B.hp <= 0 || B.heroHp <= 0 || B.i + 1 >= B.list.length;
  $("next").textContent = over ? "けっかを みる" : "つぎへ";
  $("next").hidden = false;
}

$("next").onclick = async () => {
  if (B.busy) return;
  B.busy = true; $("next").hidden = true;
  if (B.hp <= 0) {
    $("mon").classList.add("dead");
    await typeText($("msg"), `${B.monName}を やっつけた！`); await wait(600);
    return finish("win");
  }
  if (B.heroHp <= 0) {
    await typeText($("msg"), `${heroName()}は ちからつきた…`); await wait(600);
    return finish("lose");
  }
  B.i++;
  if (B.i >= B.list.length) {
    await typeText($("msg"), `${B.monName}は にげだした！`); await wait(600);
    return finish("escape");
  }
  ask();
};
$("quit").onclick = () => {
  if (!B) return;
  if (B.i === 0 && !B.answered) { show("home"); refreshHome(); return; }
  finish("quit");
};

// ---- けっか ----
function finish(how) {
  if (typing) typing.finish();
  const total = B.i + (B.answered ? 1 : 0);
  const pct = total ? Math.round(B.right / total * 100) : 0;
  const before = levelOf(save.exp).lv;
  let bonus = 0;
  if (how === "win") { bonus = 30 + B.list.length * 2; save.wins++; }
  const gained = B.exp + bonus;
  save.exp += gained;
  const after = levelOf(save.exp).lv;
  persist();

  $("endMsg").textContent = {
    win: `${B.monName}を たおした！`,
    lose: `${heroName()}は ちからつきた…`,
    escape: `${B.monName}は にげていった…`,
    quit: `${heroName()}は にげだした！`,
  }[how];
  $("score").textContent = `${B.right} / ${total}`;
  $("scoreMsg").textContent = `せいかいりつ ${pct}%`;
  let g = `けいけんち ${gained} かくとく！${bonus ? `（ボス ボーナス ${bonus}）` : ""}`;
  if (after > before) g += `<br><span style="color:#fde047">レベルが ${after}に あがった！</span>`;
  if (titleOf(after) !== titleOf(before)) g += `<br><span style="color:#f9a8d4">しょうごう「${titleOf(after)}」を てにいれた！</span>`;
  $("gain").innerHTML = g;

  // たからばこ
  $("chestBox").hidden = how !== "win";
  if (how === "win") setupChest();

  const cat = { win: "win", lose: "lose", escape: "escape", quit: "quit" }[how];
  say("guideResult", how === "win" ? "oops" : "happy", line(cat, { m: B.monName }));

  const uniq = [...new Set(B.wrong)];
  $("missTitle").hidden = $("missBox").hidden = uniq.length === 0;
  $("missList").innerHTML = "";
  for (const it of uniq) {
    const li = document.createElement("li");
    li.textContent = `${it.year}年 ${it.event}${it.person ? `（${it.person}）` : ""}`;
    $("missList").appendChild(li);
  }
  show("result");
}

function setupChest() {
  $("cardGet").innerHTML = "";
  $("chest").innerHTML = `<button id="chestBtn" aria-label="たからばこを あける">${SPRITES.chest}</button><div class="tap">タップして あける</div>`;
  $("chestBtn").onclick = () => {
    const fromBattle = [...B.items].map(x => x.person).filter(p => p && !save.cards.includes(p));
    const rest = PERSONS.filter(p => !save.cards.includes(p));
    const pick = fromBattle.length ? fromBattle[Math.floor(Math.random() * fromBattle.length)]
               : rest.length ? rest[Math.floor(Math.random() * rest.length)] : null;
    $("chest").innerHTML = SPRITES.chestOpen.replace("<svg", '<svg style="width:96px;height:80px;display:block;margin:0 auto"');
    if (pick) {
      save.cards.push(pick);
      $("cardGet").innerHTML = `たからばこを あけた！<br><b></b><br>の カードを てにいれた！`;
      $("cardGet").querySelector("b").textContent = pick;
    } else {
      save.exp += 30;
      $("cardGet").innerHTML = `たからばこを あけた！<br><b>けいけんちの たね</b><br>けいけんちが 30 ふえた！`;
    }
    persist();
  };
}

$("again").onclick = () => { if (B.mode === "review") $("review").onclick(); else $("start").onclick(); };
$("home2").onclick = () => { show("home"); refreshHome(); };

$("start").onclick = () => {
  const n = Number(document.querySelector("#counts input:checked").value);
  const eras = selectedEras();
  let list = shuffle(allQuestions(eras));
  if (n) list = list.slice(0, n);
  startBattle(list, "normal", eras);
};
$("review").onclick = () => {
  startBattle(shuffle(allQuestions(ERAS).filter(q => miss.has(idOf(q.item, q.type)))), "review", ERAS);
};

// ---- ずかん ----
$("openZukan").onclick = () => {
  $("zukanCount").textContent = `あつめた カード ${save.cards.length} / ${PERSONS.length}`;
  $("cards").innerHTML = "";
  for (const p of PERSONS) {
    const d = document.createElement("div");
    const have = save.cards.includes(p);
    d.className = "pcard pxbox" + (have ? "" : " locked");
    if (have) {
      const evs = ITEMS.filter(x => x.person === p).map(x => `${x.year}年 ${x.event}`).join("\n");
      d.innerHTML = `<span class="pn"></span><span class="ev" style="white-space:pre-wrap"></span>`;
      d.querySelector(".pn").textContent = p;
      d.querySelector(".ev").textContent = evs;
    } else {
      d.innerHTML = `<span class="pn">？？？</span>まだ みつけていない`;
    }
    $("cards").appendChild(d);
  }
  show("zukan");
};
$("zukanBack").onclick = () => { show("home"); refreshHome(); };

// ---- ぼうけんのしょ ----
$("openRecord").onclick = () => {
  const L = levelOf(save.exp);
  const rate = save.answered ? Math.round(save.correct / save.answered * 100) : 0;
  const rows = [
    ["なまえ", heroName()], ["レベル", `Lv ${L.lv}　${titleOf(L.lv)}`], ["けいけんち", `${save.exp}`],
    ["たたかった かいすう", `${save.battles}かい（ボスに かった ${save.wins}かい）`],
    ["せいかいした もんだい", `${save.correct} / ${save.answered}（${rate}%）`],
    ["さいだい れんぞく せいかい", `${save.bestCombo}もん`],
    ["れんぞく ログイン", `${save.days}にち（さいこう ${save.bestDays}にち）`],
    ["じんぶつ カード", `${save.cards.length} / ${PERSONS.length}`],
    ["まちがえた問題リスト", `${miss.size}問`],
  ];
  $("rec").innerHTML = rows.map(() => `<dt></dt><dd></dd>`).join("");
  rows.forEach(([k, v], i) => { $("rec").querySelectorAll("dt")[i].textContent = k; $("rec").querySelectorAll("dd")[i].textContent = v; });
  $("nameInput").value = save.name;
  show("record");
};
$("nameInput").addEventListener("change", e => { save.name = e.target.value.trim().slice(0, 8); persist(); });
$("recordBack").onclick = () => { save.name = $("nameInput").value.trim().slice(0, 8); persist(); show("home"); refreshHome(); };

refreshHome();

if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
